<title>C2 Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a reading desk. Passage list on the left, the passage as a printed page in the centre, questions beneath it; stacks to one column on phones. */
:root {
  --paper: #EEF1EF;
  --sheet: #FBFCFB;
  --ink: #18211F;
  --muted: #5B6864;
  --rule: #D3DAD7;
  --accent: #2C5878;
  --accent-soft: #DCE7EF;
  --good: #2E6B45;
  --good-soft: #DDEDE2;
  --bad: #9A3B2E;
  --bad-soft: #F3E0DB;
  --gloss: #FFF0B8;
  --f-read: "Newsreader", Georgia, "Times New Roman", serif;
  --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121816; --sheet: #1A2220; --ink: #E3E9E6; --muted: #93A19C; --rule: #2E3A37;
    --accent: #8DB8D8; --accent-soft: #23384A; --good: #86C79C; --good-soft: #1F3828;
    --bad: #E59A8B; --bad-soft: #432722; --gloss: #4A4220; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121816; --sheet: #1A2220; --ink: #E3E9E6; --muted: #93A19C; --rule: #2E3A37;
  --accent: #8DB8D8; --accent-soft: #23384A; --good: #86C79C; --good-soft: #1F3828;
  --bad: #E59A8B; --bad-soft: #432722; --gloss: #4A4220; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; }
header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; padding-bottom: 20px; border-bottom: 1px solid var(--rule); margin-bottom: 28px; }
.brand { font-family: var(--f-read); font-size: 30px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.brand span { font-family: var(--f-mono); font-size: 13px; font-weight: 500; color: var(--accent); border: 1px solid var(--accent); border-radius: 3px; padding: 1px 6px; margin-left: 8px; vertical-align: 6px; }
.tag { color: var(--muted); margin: 0; }
.desk { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 820px) { .desk { grid-template-columns: minmax(0, 1fr); } }

nav.list { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
@media (max-width: 820px) { nav.list { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; } }
.label { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; }
@media (max-width: 820px) { nav.list .label { display: none; } }
.pick { all: unset; cursor: pointer; display: grid; gap: 2px; padding: 10px 12px; border-radius: 6px; min-width: 0; }
@media (max-width: 820px) { .pick { flex: 0 0 200px; border: 1px solid var(--rule); } }
.pick:hover { background: var(--accent-soft); }
.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pick[aria-current="true"] { background: var(--sheet); box-shadow: inset 0 0 0 1px var(--rule); }
.pick b { font-family: var(--f-read); font-size: 17px; font-weight: 600; }
.pick small { color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.pick small em { font-style: normal; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

article.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: clamp(20px, 5vw, 56px); min-width: 0; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-bottom: 14px; font-variant-numeric: tabular-nums; }
h2.title { font-family: var(--f-read); font-size: clamp(26px, 4vw, 36px); line-height: 1.15; font-weight: 600; margin: 0 0 6px; text-wrap: balance; }
.source { font-style: italic; color: var(--muted); font-family: var(--f-read); margin: 0 0 28px; }
.passage { font-family: var(--f-read); font-size: 19px; line-height: 1.7; max-width: 64ch; }
.passage p { margin: 0 0 1.1em; position: relative; }
.passage p::before { content: attr(data-n); position: absolute; left: -2.4em; top: 0.35em; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
@media (max-width: 600px) { .passage p::before { position: static; margin-right: 6px; } }
.g { all: unset; cursor: help; border-bottom: 1px dotted var(--accent); }
.g:hover, .g:focus-visible, .g.on { background: var(--gloss); }
.gloss { margin: -4px 0 24px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--accent-soft); font-size: 14px; max-width: 64ch; }
.gloss b { font-family: var(--f-read); font-size: 16px; }

section.qs { margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--rule); display: grid; gap: 28px; max-width: 70ch; }
.q h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; display: flex; gap: 10px; }
.q h3 i { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--accent); padding-top: 2px; flex: none; }
.skill { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 30px; }
.opts { display: grid; gap: 6px; margin-left: 30px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.why { margin: 10px 0 0 30px; font-size: 14px; color: var(--muted); }
.why strong { color: var(--ink); }
.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 8px; }
button.act { font: 600 14px var(--f-ui); padding: 10px 18px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--sheet); cursor: pointer; }
button.act.ghost { background: transparent; color: var(--accent); }
button.act:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
button.act:disabled { opacity: 0.45; cursor: not-allowed; }
.score { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 13px; color: var(--muted); }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="brand">C2 Reading<span>CEFR C2</span></h1>
    <p class="tag">Proficiency-level passages with inference, tone and vocabulary questions. Tap a dotted word for its meaning.</p>
  </header>
  <div class="desk">
    <nav class="list" id="list" aria-label="Passages"><p class="label">Passages</p></nav>
    <article class="sheet" id="sheet"></article>
  </div>
</div>

<script>
const PASSAGES = [
  {
    id: "archive", title: "The Tyranny of the Archive", source: "Essay · cultural criticism",
    paras: [
      "There was a time when forgetting was the default and remembering the exception, an act requiring {ink|deliberate effort}, vellum and, not infrequently, a monastery. That arrangement has been quietly inverted. We now record by reflex, and it is forgetting that demands {forethought|careful planning in advance}: the setting toggled, the account closed, the photograph not taken.",
      "Enthusiasts of the digital archive tend to speak of it as an unqualified good, as though the sheer volume of what is preserved were itself a measure of cultural health. Yet an archive that keeps everything is, in a sense, an archive that has declined to do its job. Curation is a form of judgement, and judgement entails {exclusion|leaving things out}. To refuse to choose is not neutrality but {abdication|giving up a responsibility one ought to bear}.",
      "None of this is to romanticise the losses of earlier centuries, which were as often the product of fire and indifference as of discernment. The point is subtler. When nothing need be discarded, nothing need be weighed, and the faculty of weighing, like any unexercised muscle, {atrophies|wastes away through lack of use}.",
      "Perhaps the most {insidious|harmful in a gradual, hard-to-notice way} consequence is personal. A self that can be endlessly reconstructed from its own traces is a self denied the mercy of revision. We used to grow out of who we had been; now we are merely accompanied by it."
    ],
    qs: [
      { q: "What does the writer mean by saying the relationship between remembering and forgetting has been “inverted”?", skill: "Main idea",
        o: ["Societies now value memory less than they once did.", "Recording has become effortless, while not recording now requires conscious choice.", "Digital records are less durable than older physical ones.", "People forget more today because they rely on devices."],
        a: 1, why: "Paragraph 1 contrasts past effort to remember with present effort to forget: “we now record by reflex.”" },
      { q: "In paragraph 2, why does the writer describe a refusal to choose as “abdication”?", skill: "Inference",
        o: ["Because archivists lack the expertise to choose well.", "Because keeping everything is technically impossible.", "Because declining to select avoids a responsibility that curation properly involves.", "Because neutrality is a political position."],
        a: 2, why: "Curation “is a form of judgement”; refusing it is framed as shirking that duty." },
      { q: "What is the function of paragraph 3’s opening sentence?", skill: "Text organisation",
        o: ["To pre-empt the objection that the writer is nostalgic for the past.", "To introduce evidence that older archives were superior.", "To concede that the digital archive is an unqualified good.", "To shift the focus to personal identity."],
        a: 0, why: "“None of this is to romanticise…” anticipates and rejects a likely counter-reading." },
      { q: "The tone of the final paragraph is best described as", skill: "Tone & attitude",
        o: ["triumphant", "wistfully regretful", "coldly analytical", "openly satirical"],
        a: 1, why: "“The mercy of revision” and “we used to grow out of…” convey a sense of loss rather than detachment or mockery." }
    ]
  },
  {
    id: "expert", title: "In Defence of the Generalist", source: "Opinion column · work and education",
    paras: [
      "It has become something of an article of faith that the modern economy rewards depth over breadth. The specialist, we are told, commands the premium; the generalist is a {dilettante|someone who dabbles without real commitment or skill} tolerated in good times and dispensed with in bad.",
      "The evidence for this {orthodoxy|widely accepted belief} is rather thinner than its confidence suggests. Specialisation pays handsomely in stable domains, where yesterday’s patterns reliably predict tomorrow’s. Chess, tax law and certain surgical procedures fall into this category. But a great many fields are what researchers call ‘wicked’ environments: feedback is delayed, the rules shift without announcement, and expertise acquired in one decade may prove {obsolescent|becoming out of date} in the next.",
      "In such conditions, the ability to borrow a concept from one discipline and {graft|attach so it grows as part of something else} it onto another is not a distraction from serious work but frequently its engine. The history of innovation is littered with outsiders who solved problems precisely because they had not been trained to regard them as insoluble.",
      "This is not an argument against expertise, which remains indispensable. It is an argument against the assumption that narrowness and rigour are synonyms. One may range widely and still think hard."
    ],
    qs: [
      { q: "How does the writer present the view described in paragraph 1?", skill: "Writer’s stance",
        o: ["As a well-supported conclusion the writer shares.", "As a widely held belief the writer intends to question.", "As a minority opinion gaining popularity.", "As a recent finding from economic research."],
        a: 1, why: "“Article of faith” and “we are told” signal distance; paragraph 2 then challenges it." },
      { q: "According to the passage, specialisation is most valuable when", skill: "Detail",
        o: ["feedback is slow and rules change frequently.", "past patterns are a dependable guide to future outcomes.", "outsiders are unable to enter the field.", "innovation depends on borrowing ideas."],
        a: 1, why: "“Specialisation pays handsomely in stable domains, where yesterday’s patterns reliably predict tomorrow’s.”" },
      { q: "“Not a distraction from serious work but frequently its engine” suggests that cross-disciplinary thinking", skill: "Meaning in context",
        o: ["often drives meaningful progress.", "should be pursued only in spare time.", "is less rigorous than specialist work.", "slows down problem-solving."],
        a: 0, why: "An engine powers movement; the writer reframes breadth as a source of progress." },
      { q: "Which statement best summarises the writer’s conclusion?", skill: "Main idea",
        o: ["Experts should be replaced by generalists.", "Rigour and breadth are not mutually exclusive.", "Wicked environments make expertise worthless.", "Most innovation comes from untrained amateurs."],
        a: 1, why: "“It is an argument against the assumption that narrowness and rigour are synonyms.”" }
    ]
  },
  {
    id: "quiet", title: "The Economics of Quiet", source: "Feature · urban life",
    paras: [
      "Silence, in most cities, has acquired the characteristics of a luxury good. It is scarce, unevenly distributed and, increasingly, something one pays for: in the price of a flat facing a courtyard rather than a {thoroughfare|a main road}, in the subscription to a library of rain sounds, in the noise-cancelling headphones that have become the {talisman|an object thought to give protection} of the commuting classes.",
      "That quiet should be bought and sold is not in itself remarkable. What is striking is how rarely its absence is counted as a cost. A new flight path or an all-night delivery depot may be assessed for its effect on traffic and air quality, yet the sound it generates is treated as an unfortunate but {incidental|happening as a minor side effect} by-product, like weather.",
      "This is curious, given the weight of research linking chronic noise to disrupted sleep, raised blood pressure and impaired concentration in children. The harm is real; it is simply diffuse, borne in small increments by people who seldom think to attribute their fatigue to the lorry that passed at four in the morning.",
      "Policy tends to follow what is measured, and noise has proved {stubbornly|persistently, in a way hard to change} resistant to measurement in the terms that planners favour. Until it is, the market will continue to supply silence to those who can afford it and noise, free of charge, to everyone else."
    ],
    qs: [
      { q: "Why does the writer call silence a “luxury good”?", skill: "Main idea",
        o: ["Because quiet places are always expensive to build.", "Because access to it increasingly depends on the ability to pay.", "Because wealthy people prefer silence to noise.", "Because silence improves property values in every city."],
        a: 1, why: "Paragraph 1 lists ways quiet is purchased and notes it is “unevenly distributed.”" },
      { q: "The comparison of noise to weather in paragraph 2 implies that noise is", skill: "Inference",
        o: ["seen as unpredictable and dangerous.", "regarded as nobody’s responsibility.", "measured more carefully than other effects.", "a seasonal problem."],
        a: 1, why: "Weather is something that simply happens; the comparison shows noise is treated as no one’s fault." },
      { q: "Why, according to paragraph 3, is the harm from noise often overlooked?", skill: "Detail",
        o: ["The research is inconclusive.", "Its effects are spread thinly and rarely traced to their cause.", "People quickly adapt to loud environments.", "Only children are affected."],
        a: 1, why: "“Diffuse, borne in small increments by people who seldom think to attribute their fatigue…”" },
      { q: "The final sentence is best described as", skill: "Tone & attitude",
        o: ["an ironic observation about inequality.", "a confident prediction that policy will change.", "a neutral summary of the evidence.", "a call for individuals to buy headphones."],
        a: 0, why: "Noise supplied “free of charge” mimics market language to make a pointed, ironic comment on who bears the cost." }
    ]
  }
];

const KEY = "c2reading.v1";
let store = {};
try { store = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} };

const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const words = p => p.paras.join(" ").replace(/\{([^|]+)\|[^}]+\}/g, "$1").split(/\s+/).length;
const mins = p => Math.max(1, Math.round(words(p) / 200));

const listEl = document.getElementById("list");
const sheet = document.getElementById("sheet");
let current = PASSAGES[0].id;
try { const h = location.hash.slice(1); if (PASSAGES.some(p => p.id === h)) current = h; } catch (e) {}

function renderList() {
  listEl.querySelectorAll(".pick").forEach(n => n.remove());
  PASSAGES.forEach(p => {
    const b = document.createElement("button");
    b.className = "pick";
    b.setAttribute("aria-current", p.id === current);
    const r = store[p.id];
    b.innerHTML = `<b>${esc(p.title)}</b><small><span>${words(p)} words</span><em>${r ? r.score + "/" + p.qs.length : "not done"}</em></small>`;
    b.onclick = () => { current = p.id; try { history.replaceState(null, "", "#" + p.id); } catch (e) {} render(); window.scrollTo({ top: 0 }); };
    listEl.appendChild(b);
  });
}

function render() {
  renderList();
  const p = PASSAGES.find(x => x.id === current);
  const done = store[p.id];
  const paras = p.paras.map((t, i) => {
    const html = esc(t).replace(/\{([^|]+)\|([^}]+)\}/g, (_, w, d) => `<button class="g" data-w="${w}" data-d="${d}">${w}</button>`);
    return `<p data-n="${i + 1}">${html}</p>`;
  }).join("");
  const qs = p.qs.map((q, qi) => `
    <fieldset class="q" style="border:0;padding:0;margin:0">
      <h3><i>${qi + 1}.</i><span>${esc(q.q)}</span></h3>
      <p class="skill">${esc(q.skill)}</p>
      <div class="opts">${q.o.map((o, oi) => `
        <label class="opt" id="o-${p.id}-${qi}-${oi}"><input type="radio" id="r-${p.id}-${qi}-${oi}" name="q${qi}" value="${oi}"><span>${esc(o)}</span></label>`).join("")}
      </div>
      <p class="why" hidden></p>
    </fieldset>`).join("");
  sheet.innerHTML = `
    <div class="meta"><span>${esc(p.source)}</span><span>${words(p)} words</span><span>~${mins(p)} min read</span><span>${p.qs.length} questions</span></div>
    <h2 class="title">${esc(p.title)}</h2>
    <p class="source">Read the passage, then answer the questions. Paragraph numbers are in the margin.</p>
    <div class="passage" id="passage">${paras}</div>
    <section class="qs">
      <form id="quiz">${qs}
        <div class="bar" style="margin-top:28px">
          <button class="act" type="submit" id="check">Check answers</button>
          <button class="act ghost" type="button" id="reset">Try again</button>
          <span class="score" id="score" aria-live="polite"></span>
        </div>
        <p class="hint" id="hint">${done ? `Your last score on this passage: ${done.score}/${p.qs.length}.` : "Answer every question to check."}</p>
      </form>
    </section>`;

  const passage = document.getElementById("passage");
  passage.addEventListener("click", e => {
    const g = e.target.closest(".g"); if (!g) return;
    passage.querySelectorAll(".gloss").forEach(n => n.remove());
    const was = g.classList.contains("on");
    passage.querySelectorAll(".g.on").forEach(n => n.classList.remove("on"));
    if (was) return;
    g.classList.add("on");
    const box = document.createElement("div");
    box.className = "gloss";
    box.innerHTML = `<b>${g.dataset.w}</b> — ${g.dataset.d}`;
    g.closest("p").after(box);
  });

  const form = document.getElementById("quiz");
  const check = document.getElementById("check");
  const sync = () => { check.disabled = p.qs.some((_, i) => !form.querySelector(`input[name=q${i}]:checked`)); };
  form.addEventListener("change", sync); sync();
  form.addEventListener("submit", e => {
    e.preventDefault();
    let score = 0;
    p.qs.forEach((q, qi) => {
      const v = +form.querySelector(`input[name=q${qi}]:checked`).value;
      if (v === q.a) score++;
      q.o.forEach((_, oi) => {
        const l = document.getElementById(`o-${p.id}-${qi}-${oi}`);
        l.classList.toggle("right", oi === q.a);
        l.classList.toggle("wrong", oi === v && v !== q.a);
      });
      const why = form.querySelectorAll(".why")[qi];
      why.innerHTML = `<strong>${v === q.a ? "Correct." : "Answer: " + String.fromCharCode(65 + q.a) + "."}</strong> ${esc(q.why)}`;
      why.hidden = false;
    });
    form.querySelectorAll("input").forEach(i => i.disabled = true);
    check.disabled = true;
    document.getElementById("score").textContent = `${score}/${p.qs.length} correct`;
    document.getElementById("hint").textContent = score === p.qs.length ? "Full marks. Pick another passage." : "Read the explanations, then look again at the paragraph each one points to.";
    store[p.id] = { score, at: Date.now() }; save(); renderList();
  });
  document.getElementById("reset").onclick = () => render();
}
render();
</script>
